name: Skill Security Scan

on:
  push:
    branches: [ main, master ]
    paths:
      - 'config/skills/**'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'config/skills/**'
  workflow_dispatch:

concurrency:
  group: skill-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-security:
    name: SkillSpector Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SkillSpector
        run: |
          pip install --upgrade pip
          pip install skillspector

      - name: Run SkillSpector scan (core skills)
        id: scan_core
        run: |
          echo "Scanning config/skills/core/ ..."
          skillspector scan config/skills/core/ \
            --format sarif \
            --output skillspector-core.sarif \
            --fail-on HIGH

      - name: Run SkillSpector scan (user skills, if exist)
        id: scan_user
        if: ${{ always() }}
        run: |
          if [ -d "config/skills/user" ] && [ "$(ls -A config/skills/user)" ]; then
            echo "Scanning config/skills/user/ ..."
            skillspector scan config/skills/user/ \
              --format sarif \
              --output skillspector-user.sarif \
              --fail-on HIGH
          else
            echo "No user skills directory or empty, skipping"
            echo "SKIPPED=true" >> $GITHUB_OUTPUT
          fi

      - 名字: 运行SkillSpector扫描（供应商技能，如果存在）
